name: Defeito
description: Algo não funciona como a documentação diz.
labels: ["defeito"]
body:
  - type: markdown
    attributes:
      value: |
        **Esta issue é pública.** Não anexe nem cole dados de clientes — banco, relatório,
        `projeto.yaml`, `perfil.md`, nomes, matrículas — nem o seu `.env` ou o token, nem
        num print de tela. Reproduza o defeito com um banco inventado.
  - type: checkboxes
    id: privacidade
    attributes:
      label: Antes de enviar
      options:
        - label: Nada aqui tem dado de cliente, nome, matrícula ou token.
          required: true
  - type: input
    id: versao
    attributes:
      label: Versão
      description: A primeira linha de `flatcap --version`.
      placeholder: flatcap 1.13.1
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: comando
    attributes:
      label: O comando
      placeholder: flatcap descritiva 42 --sim
  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu, e o que você esperava
    validations:
      required: true
  - type: textarea
    id: saida
    attributes:
      label: A saída do terminal
      description: Confira antes que ela não mostra nome, matrícula ou valor do banco.
      render: text
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir com um banco inventado
      description: As colunas, alguns valores e o dicionario.csv que bastam para o defeito aparecer.
