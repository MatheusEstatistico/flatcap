# Publica uma versão: `git tag v1.13.1 && git push origin v1.13.1`.
#
# Constrói o wheel e o sdist, confere que a etiqueta é a versão do __init__.py,
# instala o wheel num ambiente limpo e roda a ponta a ponta contra ele, e cria a
# versão no GitHub com os dois arquivos e as notas do CHANGELOG.md. O PyPI fica
# desligado até a variável PUBLICAR_NO_PYPI valer `true` — ver o docs/Doc.Flatcap.md.
name: Versão

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  construir:
    name: constrói e confere o pacote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: a etiqueta é a versão do pacote
        run: |
          versao=$(python - <<'PY'
          import ast, pathlib
          arvore = ast.parse(pathlib.Path("src/flatcap/__init__.py").read_text(encoding="utf-8"))
          print(next(
              no.value.value for no in arvore.body
              if isinstance(no, ast.Assign) and getattr(no.targets[0], "id", "") == "__version__"
          ))
          PY
          )
          if [ "v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A etiqueta $GITHUB_REF_NAME não é a versão $versao do __init__.py."
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: o wheel, num ambiente limpo, passa na ponta a ponta
        run: |
          python -m venv "$RUNNER_TEMP/limpo"
          "$RUNNER_TEMP/limpo/bin/python" -m pip install dist/*.whl pytest
          "$RUNNER_TEMP/limpo/bin/flatcap" --version
          PATH="$RUNNER_TEMP/limpo/bin:$PATH" "$RUNNER_TEMP/limpo/bin/python" -m pytest -m e2e -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github:
    name: publica a versão no GitHub
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: as notas da versão, tiradas do CHANGELOG.md
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '
            index($0, "## [" v "]") == 1 { dentro = 1; next }
            dentro && /^## \[/           { exit }
            dentro                       { print }
          ' CHANGELOG.md > notas.md
          wheel="flatcap-${versao}-py3-none-any.whl"
          endereco="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${wheel}"
          {
            echo
            echo "## Instalar"
            echo
            echo '```bash'
            echo "uv tool install ${endereco}"
            echo "# ou"
            echo "pipx install ${endereco}"
            echo '```'
            echo
            echo "Depois: \`flatcap doctor --criar-env\`, preencher as três chaves e \`flatcap doctor\`."
          } >> notas.md
      - name: cria a versão com o wheel e o sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "FlatCap ${GITHUB_REF_NAME#v}" \
            --notes-file notas.md \
            --verify-tag

  pypi:
    name: publica no PyPI
    needs: construir
    if: vars.PUBLICAR_NO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flatcap/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
