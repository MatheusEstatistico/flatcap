[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatcap"
version = "1.7.0"
description = "Orquestra o flúxo de atendimento estatístico: REDCap -> pastas -> análises -> relatorio.docx"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matheus Fernandes", email = "matheusdfernandes@gmail.com" }]

dependencies = [
  "typer",
  "rich",
  "requests",
  "pandas>=3.0",
  "openpyxl",
  "pyyaml",
  "ruamel.yaml",
  "python-dotenv",
  "matplotlib",
  "python-docx>=1.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Cria o executavel `flatcap` no .venv/bin apontando para o objeto `app` do typer.
[project.scripts]
flatcap = "flatcap.cli:app"

# Layout src/: o setuptools so procura pacotes dentro de src/.
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes, I = ordenacao de imports,
# UP = moderniza sintaxe, B = armadilhas comuns (bugbear).
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
# 
# 
known-first-party = ["flatcap", "conftest", "servidor_falso", "bancos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 
# 
pythonpath = ["src", "tests"]
markers = [
    "e2e: sobe um REDCap falso em HTTP e roda o flatcap como subprocesso.",
]
# 
# 
addopts = "-m 'not e2e'"

